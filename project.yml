name: FinTrack

options:
  bundleIdPrefix: ca.regis
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Debug
  xcodeVersion: "2600"   # LastUpgradeCheck = 2600 (Xcode 26)

# Project-level settings inherited by all targets (XcodeGen "Validate Settings").
settings:
  base:
    DEVELOPMENT_TEAM: 38N594NGP9
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

targets:
  FinTrack:
    type: application
    platform: iOS
    sources:
      - path: FinTrack
        excludes:
          - "**/*.md"

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.regis.fintrack
        PRODUCT_NAME: FinTrack
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"           # iPhone only for v1; set "1,2" for iPad too
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: FinTrack/Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: FinTrack
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance

        INFOPLIST_KEY_NSFaceIDUsageDescription: "FinTrack utilise Face ID pour déverrouiller l'app et protéger vos données financières."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_LANGUAGE: en
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "iPhone Developer"
    entitlements:
      path: FinTrack/FinTrack.entitlements
      properties:
        aps-environment: development
        com.apple.developer.icloud-container-identifiers:
          - iCloud.ca.regis.fintrack
        com.apple.developer.icloud-services:
          - CloudKit
    dependencies:
      - target: FinTrackWidget
        embed: true
  FinTrackWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FinTrackWidget
      - path: FinTrack/Models/WidgetData.swift
    entitlements:
      path: FinTrackWidget/FinTrackWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.regis.fintrack.widget
        PRODUCT_NAME: FinTrackWidget
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: FinTrackWidget/Info.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "iPhone Developer"
        SKIP_INSTALL: YES

schemes:
  FinTrack:
    build:
      targets:
        FinTrack: all
    run:
      config: Debug
      commandLineArguments:
        "-com.apple.CoreData.Logging.stderr 1": true
        "-com.apple.CoreData.CloudKitDebug 1": true
    archive:
      config: Release
  FinTrackWidget:
    build:
      targets:
        FinTrackWidget: all
        FinTrack: [run]
    run:
      config: Debug
      askForAppToLaunch: true
      launchAutomaticallySubstyle: 2
      environmentVariables:
        _XCWidgetKind: fintrack.balance
        _XCWidgetFamily: medium
